name: Daily Scraper

on:
  schedule:
    - cron: '0 0 * * *'
  workflow_dispatch:

jobs:
  scrape:
    runs-on: ubuntu-latest
    
    steps:
    - uses: actions/checkout@v4
    
    - name: Setup Python
      uses: actions/setup-python@v5
      with:
        python-version: '3.10'
    
    # 这一步已经包含了安装 Playwright 和其系统依赖，不要再手动 apt-get update 了
    - name: Install dependencies
      run: |
        python -m pip install --upgrade pip
        pip install -r requirements.txt
        playwright install chromium
    
    # ⚠️ 删掉下面这一大段 Install browser dependencies (fix) 步骤
    # - name: Install browser dependencies (fix)
    #   run: ...
    #   continue-on-error: true

    - name: Run scraper
      env:
        AKUBELA_USERNAME: ${{ secrets.AKUBELA_USERNAME }}
        AKUBELA_PASSWORD: ${{ secrets.AKUBELA_PASSWORD }}
        SENDER_EMAIL: ${{ secrets.SENDER_EMAIL }}
        SENDER_PASSWORD: ${{ secrets.SENDER_PASSWORD }}
        RECEIVER_EMAIL: ${{ secrets.RECEIVER_EMAIL }}
      run: python scraper.py
    
    - name: Upload data
      if: always()
      uses: actions/upload-artifact@v4
      with:
        name: scraper-data
        path: data/
