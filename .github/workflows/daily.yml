name: Daily Scraper

on:
  schedule:
    - cron: '0 0 * * *'
  workflow_dispatch:

jobs:
  scrape:
    runs-on: ubuntu-latest
    
    steps:
    - uses: actions/checkout@v4
    
    - name: Setup Python
      uses: actions/setup-python@v5
      with:
        python-version: '3.10'
    
    - name: Install dependencies
      run: |
        python -m pip install --upgrade pip
        pip install -r requirements.txt
        playwright install chromium
    
    - name: Install browser dependencies (fix)
      run: |
        sudo apt-get update
        sudo apt-get install -y \
          libnss3 \
          libatk-bridge2.0-0 \
          libdrm2 \
          libxkbcommon0 \
          libgbm1 \
          libasound2t64 \
          libxcomposite1 \
          libxdamage1 \
          libxfixes3 \
          libxrandr2 \
          libxtst6 \
          libpango-1.0-0 \
          libcairo2 \
          libatspi2.0-0 \
          libx11-xcb1 \
          libxcb1 \
          libxcb-shm0 \
          libxcb-xfixes0 \
          libxcb-shape0 \
          libxcb-randr0 \
          libxcb-keysyms1 \
          libxcb-icccm4 \
          libxcb-xinerama0 \
          libxcb-xkb1 \
          libxkbcommon-x11-0
      continue-on-error: true
    
    - name: Run scraper
      env:
        AKUBELA_USERNAME: ${{ secrets.AKUBELA_USERNAME }}
        AKUBELA_PASSWORD: ${{ secrets.AKUBELA_PASSWORD }}
        SENDER_EMAIL: ${{ secrets.SENDER_EMAIL }}
        SENDER_PASSWORD: ${{ secrets.SENDER_PASSWORD }}
        RECEIVER_EMAIL: ${{ secrets.RECEIVER_EMAIL }}
      run: python scraper.py
    
    - name: Upload data
      if: always()
      uses: actions/upload-artifact@v4
      with:
        name: scraper-data
        path: data/
